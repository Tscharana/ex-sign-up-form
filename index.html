<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up form</title>
    <link rel="stylesheet" href="./css/main.css">
    <script src="./js/script.js"></script>
</head>
<body>
    <div class="main-container">
        <aside>
            <div class="logo-wrapper">
                <img class="logo" src="./img/odin-logo.png" alt="The ODIN logo">
                <div class="logo-text">ODIN</div>
            </div>
            <div class="credit">Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a href="https://unsplash.com/">Unsplash</a></div>
        </aside>
        <main>
            <div class="intro-text">
                <div>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.<br>Sign on <em>now</em> to get started.<br><br>You <em>know</em> you want to.</div>
            </div>
            <div class="form-container">
                <p>Let's do this!</p>
                <form action="#" method="post" id="form-create-account">
                    <fieldset>
                        <div class="form-row">
                            <div class="form-item">
                                <label for="first-name">FIRST NAME</label>
                                <input type="text" name="first-name" id="first-name">
                            </div>
                            <div class="form-item">
                                <label for="last-name">LAST NAME</label>
                                <input type="text" name="last-name" id="last-name">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <label for="email">EMAIL</label>
                                <input type="email" name="email" id="email">
                            </div>
                            <div class="form-item">
                                <label for="tel">PHONE NUMBER</label>
                                <input type="tel" name="tel" id="tel">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <label for="password1">PASSWORD</label>
                                <input type="password" name="password1" id="password1">
                            </div>
                            <div class="form-item">
                                <label for="password2">CONFIRM PASSWORD</label>
                                <input type="password" name="password2" id="password2">
                            </div>
                        </div>
                    </fieldset>
                </form>
            </div>
            <div class="action-area">
                <button type="submit" form="form-create-account">Create Account</button>
                <p>Already have an account? <a href="#">Log in</a></p>
            </div>
        </main>
    </div>
</body>
</html>
