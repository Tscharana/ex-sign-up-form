<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up form</title>
    <link rel="stylesheet" href="./css/main.css">
    <script src="./js/script.js"></script>
</head>
<body>
    <div class="main-container">
        <aside>
            <div class="logo-wrapper">
                <img class="logo" src="./img/odin-logo.png" alt="The ODIN logo">
                <div class="logo-text">ODIN</div>
            </div>
            <footer class="credit">Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a href="https://unsplash.com/">Unsplash</a></footer>
        </aside>
        <main>
            <section class="intro-text">
                <h2>This is not a real online service!</h2>
                <div>You know you need something like this in your life to help you realize your deepest dreams.<br>Sign on <em>now</em> to get started.<br><br>You <em>know</em> you want to.</div>
            </section>
            <div class="form-container">
                <h2>Let's do this!</h2>
                <form action="#" method="post" id="form-create-account">
                    <fieldset>
                        <div class="form-row">
                            <div class="form-item">
                                <label for="first-name">FIRST NAME</label>
                                <input type="text" name="first-name" id="first-name" placeholder="John" required>
                            </div>
                            <div class="form-item">
                                <label for="last-name">LAST NAME</label>
                                <input type="text" name="last-name" id="last-name" placeholder="Doe" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <label for="email">EMAIL</label>
                                <input type="email" name="email" id="email" placeholder="John.Doe@gmail.com" required>
                            </div>
                            <div class="form-item">
                                <label for="tel">PHONE NUMBER</label>
                                <input type="tel" name="tel" id="tel" placeholder="+1 808 XXX XXXX" pattern="[0-9+\s\-]+" title="Please enter a valid phone number (number, spaces, - or + only)">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-item">
                                <label for="password">PASSWORD</label>
                                <input type="password" name="password" id="password" minlength="6" required>
                            </div>
                            <div class="form-item">
                                <label for="password-confirm">CONFIRM PASSWORD</label>
                                <input type="password" name="password_confirm" id="password-confirm" minlength="6" required>
                            </div>
                        </div>
                    </fieldset>
                </form>
            </div>
            <section class="action-area">
                <button type="submit" form="form-create-account">Create Account</button>
                <p>Already have an account? <a href="#">Log in</a></p>
            </section>
        </main>
    </div>
</body>
</html>
